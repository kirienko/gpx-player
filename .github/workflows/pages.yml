# Publishes the interactive OpenSeaMap demo to https://kirienko.github.io/gpx-player/
#
# One-time setup: in the repository settings, under Pages, set
# "Build and deployment" -> Source to "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer commit supersede an in-flight deployment, but never cancel a
# deployment that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build the demo map
        run: python scripts/build_demo.py --output-dir site

      - name: Add .nojekyll
        run: touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
