[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpx-player"
version = "0.5.2"
description = "Visualise & animate GPX race tracks."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Yury Kirienko"}]
requires-python = ">=3.9"

dependencies = [
  "folium",
  "jinja2",
  "matplotlib",
  "pytz",
  "lxml",
  "numpy",
  "gpxpy",
]

[project.scripts]              # CLI entry-points after `pip install gpx-player`
gpx-player   = "gpx_player.main:main"
gpx-validate = "gpx_player.validator:main"

[tool.setuptools.packages.find]
# Flat layout: without an explicit exclude, setuptools ships every top-level
# directory (tests/, scripts/, stale build/) as an importable package.
# NOTE: "schema" is deliberately NOT excluded. validator.load_schema() resolves
# the XSDs via Path(__file__).parent.parent / "schema", i.e. site-packages/schema
# for an installed wheel, so dropping it would break gpx-validate.
exclude = ["tests*", "scripts*", "build*", "dist*", "example-data*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"gpx_player.assets" = ["*.js", "*.html", "*.css"]
